[project]
name = "clawshire-cli"
version = "0.1.0"
description = "ClawShire CLI for notice query, annual report query, and annual analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "packaging>=24.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
clawshire = "clawshire_cli.main:main"
cs = "clawshire_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawshire_cli*", "clawshire_sdk*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
